<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AWS EC2 Deployment</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #232f3e 0%, #ff9900 100%);
      color: #fff;
    }

    main {
      text-align: center;
      padding: 2rem;
      background: rgba(0, 0, 0, 0.35);
      border-radius: 12px;
      max-width: 560px;
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 0.75rem;
    }

    p {
      line-height: 1.6;
      opacity: 0.95;
    }

    .names {
      margin-top: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .names strong {
      font-size: 1.75rem;
      font-weight: 800;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <main>
    <h1>AWS class LAB Assignment</h1>
    <p>This AWS EC2 Assignment is done by Saboor, Shayan, and MUSA.</p>
    <div class="names">
      <strong>Saboor</strong>
      <strong>Shayan</strong>
      <strong>MUSA</strong>
    </div>
  </main>
</body>
</html>
